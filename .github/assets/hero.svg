<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Watcharapon Thodraksa, AI and MLOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070D"/><stop offset="0.5" stop-color="#0B1B33"/><stop offset="1" stop-color="#0A1A2F"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="0.55" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(980 60) rotate(120) scale(320)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(160 300) rotate(-45) scale(360)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.38"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- right side: a deploy topology, drawn from the actual stack -->
    <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.4">
      <path d="M866 96 L946 96 M866 96 L906 150 M946 96 L906 150 M906 150 L866 204 M906 150 L946 204 M866 204 L946 204"/>
      <path d="M812 150 L866 150 M946 150 L1000 150" stroke-dasharray="4 5"/>
    </g>
    <g fill="#0B1B33" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.4">
      <rect x="846" y="82" width="40" height="28" rx="5"/>
      <rect x="926" y="82" width="40" height="28" rx="5"/>
      <rect x="886" y="136" width="40" height="28" rx="5"/>
      <rect x="846" y="190" width="40" height="28" rx="5"/>
      <rect x="926" y="190" width="40" height="28" rx="5"/>
    </g>
    <g fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" text-anchor="middle">
      <text x="866" y="100">pod</text>
      <text x="946" y="100">pod</text>
      <text x="906" y="154">svc</text>
      <text x="866" y="208">pod</text>
      <text x="946" y="208">pod</text>
    </g>
    <text x="906" y="246" fill="#38BDF8" fill-opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" text-anchor="middle">helm upgrade --install</text>

    <rect x="72" y="92" width="4" height="136" rx="2" fill="url(#accent)"/>

    <text x="104" y="128" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" letter-spacing="3.5" fill="#7DD3FC">AI ENGINEER · MLOPS · BACKEND</text>
    <text x="104" y="186" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#F8FAFC">Watcharapon Thodraksa</text>
    <text x="104" y="222" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#94A3B8">Kasetsart CS 2025 · Bangkok · open to relocating</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">
      <rect x="104" y="246" width="212" height="30" rx="15" fill="#0EA5E9" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text x="120" y="266" fill="#7DD3FC">Kubernetes · Helm · CI/CD</text>
      <rect x="328" y="246" width="200" height="30" rx="15" fill="#6366F1" fill-opacity="0.12" stroke="#818CF8" stroke-opacity="0.45"/>
      <text x="344" y="266" fill="#A5B4FC">RAG · LangGraph · Ollama</text>
      <rect x="540" y="246" width="186" height="30" rx="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/>
      <text x="556" y="266" fill="#67E8F9">Kafka · Spring Boot</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#1E293B"/>
</svg>
